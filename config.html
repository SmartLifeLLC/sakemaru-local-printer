<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>酒まる印刷 - 設定</title>
    <style>
        body{font-family:sans-serif;padding:16px;}
        label,fieldset{display:block;margin-bottom:8px;}
        select{width:300px;margin-top:4px;}
    </style>
</head>
<body>
<h1>設定</h1>
<label>ポーリング間隔 (ms):
  <input type="number" id="cfg-pollInterval"/>
</label>
<label>取得 API アドレス:
  <input type="text" id="cfg-apiAddress" size="50"/>
</label>
<label>SYNC API アドレス:
  <input type="text" id="cfg-syncApiAddress" size="50"/>
</label>

<fieldset>
  <legend>プリンタ設定</legend>
  <button id="btn-load-printers" type="button">プリンタ一覧を読み込み</button>
  <label>プリンタ 1:
    <select id="cfg-printer1">
      <option value="">（未設定）</option>
    </select>
  </label>
  <label>プリンタ 2:
    <select id="cfg-printer2">
      <option value="">（未設定）</option>
    </select>
  </label>
  <label>プリンタ 3:
    <select id="cfg-printer3">
      <option value="">（未設定）</option>
    </select>
  </label>
  <label>プリンタ 4:
    <select id="cfg-printer4">
      <option value="">（未設定）</option>
    </select>
  </label>
</fieldset>

<fieldset>
  <legend>S3設定</legend>
  <label>Bucket:
    <input type="text" id="cfg-s3-bucket"/>
  </label>
  <label>Region:
    <input type="text" id="cfg-s3-region"/>
  </label>
  <label>AccessKeyId:
    <input type="text" id="cfg-s3-accessKeyId"/>
  </label>
  <label>SecretAccessKey:
    <input type="password" id="cfg-s3-secretAccessKey"/>
  </label>
</fieldset>
<button id="btn-save-config">保存</button>

<script src="renderer.js"></script>
</body>
</html>
