<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>酒まる印刷</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 900px;
            margin: 0 auto;
        }
        .printer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        #printer-grid {
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }
        .printer-slot {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 0 4px;
            margin: 0;
            background: transparent;
        }
        .printer-slot .printer-number {
            padding: 1px 5px;
            font-size: 10px;
            margin: 0;
            min-width: 18px;
            text-align: center;
            background: #e0e0e0;
            color: #666;
            font-weight: 600;
            border-radius: 3px;
        }
        .printer-slot select {
            flex: 1;
            margin: 0 !important;
            padding: 2px 4px !important;
            font-size: 12px;
            border-width: 1px;
            border-radius: 0;
        }
        .printer-settings-btn {
            width: auto !important;
            padding: 2px 6px !important;
            margin: 0 !important;
            font-size: 12px !important;
            background: transparent !important;
            color: #667eea !important;
            border: 1px solid #ddd !important;
            border-radius: 4px !important;
            cursor: pointer;
            line-height: 1.2;
            box-shadow: none !important;
            font-weight: normal !important;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .printer-settings-btn:hover {
            background: rgba(102, 126, 234, 0.1) !important;
            transform: none !important;
            box-shadow: none !important;
        }
        .printer-settings-btn:disabled {
            color: #ccc !important;
            cursor: not-allowed;
            background: transparent !important;
        }
        .printer-settings-btn.has-custom {
            color: #fff !important;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            border-color: #667eea !important;
        }

        /* モーダル */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 12px;
            padding: 20px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal h3 {
            margin: 0 0 5px 0;
            color: #667eea;
            font-size: 18px;
        }
        .modal .modal-subtitle {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
            word-break: break-all;
        }
        .modal label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-top: 10px;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .modal select,
        .modal input {
            width: 100%;
            padding: 6px 8px;
            font-size: 13px;
            border: 2px solid #ddd;
            border-radius: 6px;
            margin: 0;
            pointer-events: auto;
            user-select: text;
            -webkit-user-select: text;
        }
        .modal input[type="text"],
        .modal input[type="number"] {
            background: #fff;
            color: #333;
            -webkit-app-region: no-drag;
            position: relative;
            z-index: 10;
        }
        .modal-overlay.active * {
            pointer-events: auto;
        }
        .modal-overlay.active .modal {
            position: relative;
            z-index: 1001;
        }
        .modal .offset-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .modal .help-text {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }
        .modal .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }
        .modal .modal-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            margin: 0;
        }
        .btn-outline {
            background: #f5f5f5 !important;
            color: #555 !important;
            border: 1px solid #ddd !important;
        }
        .btn-outline:hover {
            background: #eaeaea !important;
            box-shadow: none !important;
            transform: none !important;
        }
        h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 8px;
            text-align: center;
        }
        h2 {
            color: #555;
            font-size: 18px;
            margin-top: 15px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }
        .section {
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin: 6px 0;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        select, input {
            width: 100%;
            padding: 8px;
            font-size: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 5px 0;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-top: 8px;
            margin-bottom: 3px;
            font-size: 13px;
        }
        .printer-slot {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            margin: 5px 0;
        }
        .printer-number {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }
        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin: 8px 0;
        }
        .button-row button {
            flex: 1;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            margin-left: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            margin-top: 0;
            border-bottom: 2px solid #667eea;
        }
        .tab {
            padding: 10px 20px;
            background: #f5f5f5;
            border: none;
            color: #666;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 4px solid transparent;
            margin-bottom: -2px;
            border-radius: 8px 8px 0 0;
        }
        .tab:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }
        .tab.active {
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-bottom-color: #667eea;
            box-shadow: 0 -3px 15px rgba(102, 126, 234, 0.3);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .status-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .status-label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        .status-value {
            font-size: 15px;
            font-weight: 700;
            color: #667eea;
        }
        .profile-badge {
            display: inline-block;
            padding: 3px 12px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            border-radius: 12px;
            background: #888;
            letter-spacing: 0.5px;
        }
        .profile-badge.profile-prod {
            background: #dc3545;
        }
        .profile-badge.profile-stg {
            background: #2196f3;
        }
        .profile-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .profile-switcher label {
            margin: 0;
            font-size: 13px;
            white-space: nowrap;
        }
        .profile-switcher select {
            flex: 1;
            margin: 0;
            padding: 4px 8px;
            font-size: 13px;
        }
        .profile-switcher button {
            width: auto;
            margin: 0;
            padding: 4px 12px;
            font-size: 12px;
            white-space: nowrap;
        }
        .settings-box {
            border: 1px solid #ddd;
            border-radius: 0;
            padding: 6px 10px;
            margin: 0;
            border-bottom: none;
        }
        .settings-box:first-child {
            border-radius: 6px 6px 0 0;
        }
        .settings-box:last-of-type {
            border-radius: 0 0 6px 6px;
            border-bottom: 1px solid #ddd;
        }
        .settings-box .printer-grid {
            margin: 0;
            gap: 4px;
        }
        .settings-box label {
            margin-top: 0;
            margin-bottom: 1px;
            font-size: 12px;
        }
        .settings-box input,
        .settings-box select {
            padding: 4px 6px;
            margin: 0;
            font-size: 13px;
        }
        .log-box {
            background: #1e1e1e;
            color: #f8f9fa;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 12px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .log-box::-webkit-scrollbar {
            width: 8px;
        }
        .log-box::-webkit-scrollbar-track {
            background: #2e2e2e;
            border-radius: 4px;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="tabs">
        <button class="tab active" data-tab="home">🍶 酒まる印刷</button>
        <button class="tab" data-tab="printers">🖨️ プリンタ設定</button>
        <button class="tab" data-tab="settings">⚙️ 酒まる通信設定</button>
    </div>

    <div id="tab-home" class="tab-content active">
        <div class="section">
            <h2>ポーリング制御</h2>
            <div class="status-box">
                <div class="status-item">
                    <span class="status-label">環境:</span>
                    <span id="home-profile-badge" class="profile-badge">---</span>
                </div>
                <div class="status-item">
                    <span class="status-label">状態:</span>
                    <span id="polling-status" class="status-value">停止中</span>
                </div>
                <div class="status-item">
                    <span class="status-label">最終取得時刻:</span>
                    <span id="last-poll-time" class="status-value">---</span>
                </div>
                <div class="status-item">
                    <span class="status-label">バージョン:</span>
                    <span id="app-version" class="status-value">---</span>
                </div>
            </div>
            <button id="btn-start-polling" class="btn-secondary">▶️ 開始</button>
        </div>

        <div class="section">
            <h2>エラーログ</h2>
            <div id="error-log" class="log-box"></div>
            <button id="btn-stop-polling" class="btn-danger" style="display: none;">⏹️ 停止</button>
        </div>
    </div>

    <div id="tab-printers" class="tab-content">
        <div class="section">
            <h2>プリンタ設定</h2>
            <p style="color: #666; font-size: 13px; margin: 0 0 10px 0;">
                ※ プリンタ設定を保存すると、選択した倉庫のサーバーに自動同期されます
            </p>
            <div class="button-row">
                <button id="btn-load" class="btn-secondary">📋 プリンタ一覧を読み込み</button>
                <button id="btn-save-printers" class="btn-secondary">💾 保存 & サーバー同期</button>
            </div>

            <div class="printer-grid" id="printer-grid">
                <!-- プリンタスロットはrenderer.jsで動的に生成 -->
            </div>
            <div id="printer-duplicate-warning" style="display: none; color: #555; font-size: 12px; margin-top: 5px;">
                ℹ️ 同じプリンタが複数のスロットに割当てられています。スロットごとに別設定で印刷できます。
            </div>
        </div>

        <div class="section">
            <h2>テスト印刷</h2>
            <label>印刷するプリンタ:</label>
            <select id="test-printer">
                <option value="">（プリンタを選択）</option>
            </select>
            <button id="btn-print">🖨️ sample.pdfを印刷</button>
        </div>
    </div>

    <div id="tab-settings" class="tab-content">
        <div class="profile-switcher">
            <label>環境プロファイル:</label>
            <span id="settings-profile-badge" class="profile-badge">---</span>
            <select id="profile-select">
                <option value="prod">本番</option>
                <option value="stg">ステージング</option>
            </select>
            <button id="btn-switch-profile" type="button">🔄 切替</button>
        </div>

        <div class="settings-box">
            <div class="printer-grid">
                <div>
                    <label>API ホスト:</label>
                    <input type="text" id="cfg-apiHost" placeholder="tani-hub.sakemaru.click" />
                </div>
                <div>
                    <label>ポーリング間隔 (ms):</label>
                    <input type="number" id="cfg-pollInterval" />
                </div>
                <div>
                    <label>API認証トークン (Bearer):</label>
                    <input type="password" id="cfg-apiToken" placeholder="認証トークンを入力してください" />
                </div>
                <div>
                    <label>クライアントID:</label>
                    <input type="text" id="cfg-clientId" readonly style="background: #f0f0f0; color: #666;" />
                </div>
            </div>
            <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
                <span style="font-size: 12px; font-weight: 600; color: #555; white-space: nowrap;">倉庫:</span>
                <span id="current-warehouse-display" style="font-size: 12px; font-weight: 700; color: #667eea; min-width: 120px;">読み込み中...</span>
                <select id="cfg-warehouseId" style="flex: 1; margin: 0; padding: 4px 6px; font-size: 13px;">
                    <option value="">（クライアントID で識別）</option>
                </select>
                <button id="btn-load-warehouses" type="button" style="width: auto; margin: 0; padding: 4px 8px; font-size: 12px; white-space: nowrap;">倉庫読み込み</button>
            </div>
        </div>

        <div class="settings-box">
            <div class="printer-grid">
                <div>
                    <label>S3 Bucket:</label>
                    <input type="text" id="cfg-s3-bucket" />
                </div>
                <div>
                    <label>S3 Region:</label>
                    <input type="text" id="cfg-s3-region" />
                </div>
                <div>
                    <label>S3 AccessKeyId:</label>
                    <input type="text" id="cfg-s3-accessKeyId" />
                </div>
                <div>
                    <label>S3 SecretAccessKey:</label>
                    <input type="password" id="cfg-s3-secretAccessKey" />
                </div>
            </div>
        </div>

        <div class="settings-box">
            <div class="printer-grid">
                <div>
                    <label>印刷方式:</label>
                    <select id="cfg-printMethod">
                        <option value="pdf-to-printer">pdf-to-printer (デフォルト)</option>
                        <option value="sumatra-direct">SumatraPDF 直接呼び出し</option>
                    </select>
                </div>
                <div>
                    <label>SumatraPDF パス <small>(sumatra-direct選択時)</small>:</label>
                    <input type="text" id="cfg-sumatraPdfPath" placeholder="C:\Program Files\SumatraPDF\SumatraPDF.exe" />
                </div>
            </div>
        </div>

        <div class="button-row" style="margin-top: 8px;">
            <button id="btn-test-api" type="button" style="padding: 6px 12px; font-size: 13px;">🔗 API接続テスト</button>
            <button id="btn-save-config" class="btn-secondary" style="padding: 6px 12px; font-size: 13px;">💾 設定を保存</button>
        </div>
        <div id="api-test-result" style="margin-top:6px; padding:6px 8px; display:none; border-radius:6px; font-size: 12px;"></div>
    </div>
</div>

<!-- プリンタ別印刷設定モーダル -->
<div id="printer-settings-modal" class="modal-overlay">
    <div class="modal">
        <h3>🖨️ プリンタ別印刷設定</h3>
        <div class="modal-subtitle" id="modal-printer-name">---</div>

        <div style="position: relative; z-index: 20;">
            <label for="modal-settingName">設定名（メモ）</label>
            <input type="text" id="modal-settingName" name="modal-settingName" placeholder="例: 納品書用 / 横向きラベル など" maxlength="40" autocomplete="off" spellcheck="false" />
        </div>

        <label>印刷向き</label>
        <select id="modal-orientation">
            <option value="auto">自動（PDFの向きに従う）</option>
            <option value="portrait">縦（portrait）</option>
            <option value="landscape">横（landscape）</option>
        </select>

        <label>用紙サイズ</label>
        <select id="modal-paperSize">
            <option value="auto">自動（PDFのサイズに従う）</option>
            <option value="A4">A4</option>
            <option value="A5">A5</option>
            <option value="B5">B5</option>
            <option value="Letter">Letter</option>
            <option value="Custom191x131">カスタム 191×131 mm（横長）</option>
            <option value="Custom131x191">カスタム 131×191 mm（縦長）</option>
        </select>

        <div style="position: relative; z-index: 20; margin-top: 8px;">
            <label style="display: flex; align-items: center; gap: 6px; margin: 0; cursor: pointer;">
                <input type="checkbox" id="modal-noScale" style="width: auto; margin: 0;" />
                <span>縮小しない（原寸印刷、上端揃え）</span>
            </label>
            <div class="help-text">オン: 用紙より大きくても縮小せず、用紙の上端・左右中央に配置</div>
        </div>

        <label>印刷位置オフセット (mm)</label>
        <div class="offset-row">
            <div>
                <input type="number" id="modal-offsetX" step="0.5" value="0" />
                <div class="help-text">X方向（右が正）</div>
            </div>
            <div>
                <input type="number" id="modal-offsetY" step="0.5" value="0" />
                <div class="help-text" id="modal-offsetY-help">Y方向（上が正）</div>
            </div>
        </div>

        <div class="modal-actions" style="margin-top: 14px;">
            <button id="modal-test-print" type="button" style="padding: 8px 12px; font-size: 13px; margin: 0; flex: 1;">🧪 PDFを選んでテスト印刷</button>
        </div>
        <div id="modal-test-result" style="display: none; margin-top: 6px; padding: 6px 8px; border-radius: 6px; font-size: 12px;"></div>

        <div class="modal-actions">
            <button id="modal-reset" class="btn-outline" type="button">リセット</button>
            <button id="modal-cancel" class="btn-outline" type="button">キャンセル</button>
            <button id="modal-save" class="btn-secondary" type="button">💾 保存</button>
        </div>
    </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
